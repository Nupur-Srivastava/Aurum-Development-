<div class="auth-root">
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="bg-lines"></div>
    <div class="bg-markers"></div>
    <div class="bg-shapes"></div>
    <div class="bg-corner"></div>
    <div class="bg-corner-br"></div>
  </div>

  <!-- Brand -->
  <a class="brand" routerLink="/">
    <div class="brand-icon">
      <svg viewBox="0 0 32 32" fill="none">
        <polygon points="16,2 30,10 30,22 16,30 2,22 2,10" fill="none" stroke="#e8622a" stroke-width="2"/>
        <polygon points="16,8 24,13 24,21 16,26 8,21 8,13" fill="#e8622a" opacity="0.15"/>
        <text x="16" y="21" text-anchor="middle" font-size="10" font-weight="800" fill="#e8622a" font-family="Syne,sans-serif">A</text>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">AEC</span>
      <span class="brand-tagline">Platform</span>
    </div>
  </a>

  <div class="form-card">
    <div class="form-header">
      <h1>Welcome Back</h1>
      <p>Sign in to your account</p>
    </div>

    <form [formGroup]="signinForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="field-group">
        <label for="email">Email Address</label>
        <div class="input-wrap" [class.error]="hasError('email', 'required') || hasError('email', 'email')">
          <span class="input-icon">◉</span>
          <input id="email" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
        </div>
        <span class="err-msg" *ngIf="hasError('email', 'required')">Email is required</span>
        <span class="err-msg" *ngIf="hasError('email', 'email')">Enter a valid email</span>
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <div class="input-wrap" [class.error]="hasError('password', 'required')">
          <span class="input-icon">◆</span>
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Your password" autocomplete="current-password" />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword" tabindex="-1">
            <svg *ngIf="!showPassword" viewBox="0 0 20 20" fill="none"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z" stroke="currentColor" stroke-width="1.4"/><circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg *ngIf="showPassword" viewBox="0 0 20 20" fill="none"><path d="M3 3l14 14M8.5 8.8A2.5 2.5 0 0113.2 11.5M6 5.8C4.2 7.1 2.5 10 2.5 10s3 5.5 7.5 5.5a7.4 7.4 0 003.5-.9M10.5 4.5C14.5 4.5 17.5 10 17.5 10s-.8 1.5-2 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>
        <span class="err-msg" *ngIf="hasError('password', 'required')">Password is required</span>
      </div>

      <div class="api-error" *ngIf="errorMessage">
        <span>⚠</span> {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [class.loading]="isLoading" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner">◌</span>
      </button>

      <div class="divider"><span>or</span></div>

      <button type="button" class="btn-google" (click)="onGoogleSignIn()">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>

      <p class="switch-link">
        Don't have an account?
        <a (click)="goToSignUp()" role="button">Sign Up</a>
      </p>

    </form>
  </div>
</div>
